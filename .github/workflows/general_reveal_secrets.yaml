name: Reveal GitHub Actions Secrets

on:
  workflow_dispatch

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - id: reveal_secrets
        name: Output secrets in plain text
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
        run: |
          echo "AWS_REGION: $(echo ${AWS_REGION} | sed 's/./& /g')"
          echo "AWS_ACCOUNT: $(echo ${AWS_ACCOUNT} | sed 's/./& /g')"
          echo "GCP_CREDENTIALS: $(echo ${GCP_CREDENTIALS} | sed 's/./& /g')"
          echo "GCP_PROJECT_ID: $(echo ${GCP_PROJECT_ID} | sed 's/./& /g')"
          echo "GCP_PROJECT_NUMBER: $(echo ${GCP_PROJECT_NUMBER} | sed 's/./& /g')"
